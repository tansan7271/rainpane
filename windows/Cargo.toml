[package]
name = "rainpane"
version = "0.1.0"
edition = "2024"
description = "Rainpane for Windows (experimental port)"
license = "MIT"
publish = false

[dependencies]
egui = "0.35"
egui-directx11 = "0.13"
egui-winit = { version = "0.35", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Performance", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input", "Win32_System_Registry", "Win32_System_Power", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
windows-numerics = "0.3"
winit = "0.30.13"
